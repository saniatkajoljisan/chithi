<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Chithi</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Dancing+Script:wght@400;600;700&family=Kalam:wght@400;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Patrick+Hand&display=swap" rel="stylesheet" />
</head>
<body class="auth-page">
  
<div class="bg-lines"></div>
  
  <div class="auth-wrap">
    <a href="index.html" class="logo auth-logo">
      <span class="logo-icon">💌</span>
      <span class="logo-text">Chithi</span>
    </a>
    <div class="auth-card">
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-sub">Enter your email to receive reset link</p>

      <div id="auth-error" class="error-msg hidden"></div>

      <div class="form-group">
        <label for="reset-email">Email</label>
        <input type="email" id="reset-email" placeholder="you@example.com" />
      </div>

      <button class="btn-primary btn-full" id="btn-send-reset">
        Send Reset Link
      </button>

      <p class="auth-switch">
        <a href="login.html">Back to login</a>
      </p>
    </div>
  </div>

  <script src="clean-urls.js"></script>
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
