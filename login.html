<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Chithi</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Dancing+Script:wght@400;600;700&family=Kalam:wght@400;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Patrick+Hand&display=swap" rel="stylesheet" />
<style>
  .password-wrap {
  position: relative;
}

.password-wrap input {
  width: 100%;
  padding-right: 40px;
}

.toggle-eye {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  font-size: 16px;
}
</style>
</head>
<body class="auth-page">

  <div class="bg-lines"></div>

  <div class="auth-wrap">
    <a href="index.html" class="logo auth-logo">
      <span class="logo-icon">💌</span>
      <span class="logo-text">Chithi</span>
    </a>

    <div class="auth-card">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to read your letters.</p>

      <div id="auth-error" class="error-msg hidden"></div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
      
        <div class="password-wrap">
          <input 
            type="password" 
            id="password" 
            placeholder="Your password" 
            autocomplete="current-password" 
          />
          <span id="toggle-password" class="toggle-eye">👁️</span>
        </div>
      
      </div>

      <button class="btn-primary btn-full" id="btn-login">
        <span id="login-btn-text">Sign In →</span>
        <span id="login-spinner" class="spinner hidden"></span>
      </button>
      <button class="btn-ghost btn-full" id="btn-reset-password" style="margin-top:0.65rem;">Forgot password?</button>

      <div class="auth-divider"><span>or</span></div>

      <button class="btn-google btn-full" id="btn-google-login">
        <span class="google-mark">G</span>
        <span>Continue with Google</span>
      </button>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Create one</a></p>
    </div>
  </div>

  <script src="clean-urls.js"></script>
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
