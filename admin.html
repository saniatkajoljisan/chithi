<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Chithi</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@400;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Patrick+Hand&display=swap" rel="stylesheet" />

<style>
  /* ── Admin-only layout — reuses design tokens from styles.css ── */
  .admin-main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 1.6rem 1.2rem 4rem;
    position: relative;
    z-index: 1;
  }

  .admin-gate {
    max-width: 420px;
    margin: 4rem auto;
    text-align: center;
    padding: 2rem 1.6rem;
  }

  .admin-tabs {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 1.4rem;
    border-bottom: 1.5px solid var(--line-color);
    padding-bottom: 0.6rem;
  }
  .admin-tab {
    font-family: var(--font-body);
    font-size: 0.92rem;
    color: var(--ink-light);
    background: transparent;
    border: 1.5px solid transparent;
    border-radius: var(--radius);
    padding: 0.5rem 1rem;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .admin-tab:hover { background: var(--paper-dark); }
  .admin-tab.active {
    background: var(--gold);
    color: #fff;
    border-color: var(--gold);
  }
  .admin-tab .tab-count {
    font-size: 0.76rem;
    opacity: 0.85;
    margin-left: 0.3rem;
  }

  .admin-panel { display: none; }
  .admin-panel.active { display: block; }

  .admin-toolbar {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .admin-toolbar input[type="search"],
  .admin-toolbar select {
    font-family: var(--font-readable);
    font-size: 0.9rem;
    padding: 0.55rem 0.85rem;
    border: 1.5px solid var(--line-color);
    border-radius: var(--radius);
    background: var(--paper-card);
    color: var(--ink);
  }
  .admin-toolbar input[type="search"] { flex: 1; min-width: 180px; }

  .admin-summary-row {
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    margin-bottom: 1.2rem;
  }
  .admin-stat {
    flex: 1;
    min-width: 130px;
    background: var(--paper-card);
    border: 1.5px solid var(--line-color);
    border-radius: var(--radius);
    padding: 0.9rem 1rem;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .admin-stat-label {
    font-family: var(--font-readable);
    font-size: 0.74rem;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .admin-stat-value {
    font-family: var(--font-script);
    font-size: 1.6rem;
    color: var(--ink);
    font-weight: 700;
  }

  .admin-list { display: flex; flex-direction: column; gap: 0.7rem; }

  .admin-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.9rem;
    background: var(--paper-card);
    border: 1.5px solid var(--line-color);
    border-radius: var(--radius);
    padding: 0.85rem 1rem;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .admin-row-main { min-width: 0; flex: 1; }
  .admin-row-title {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.98rem;
    color: var(--ink);
    flex-wrap: wrap;
  }
  .admin-row-title strong { font-family: var(--font-script); font-size: 1.1rem; }
  .admin-row-sub {
    font-family: var(--font-readable);
    font-size: 0.8rem;
    color: var(--ink-faint);
    margin-top: 0.2rem;
  }
  .admin-row-snippet {
    font-family: var(--font-readable);
    font-size: 0.88rem;
    color: var(--ink-light);
    margin-top: 0.35rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 480px;
  }
  .admin-badge {
    font-family: var(--font-readable);
    font-size: 0.68rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    letter-spacing: 0.03em;
  }
  .admin-badge.reported { background: rgba(192,57,43,0.12); color: var(--red-dark); }
  .admin-badge.read     { background: rgba(39,174,96,0.12); color: var(--success); }
  .admin-badge.unread   { background: rgba(181,134,13,0.12); color: var(--gold); }

  .admin-row-actions {
    display: flex;
    gap: 0.5rem;
    flex-shrink: 0;
  }
  /* styles.css gives .btn-danger / .btn-ghost width:100% by default
     (built for full-width buttons elsewhere) — override that here so
     the small action buttons in each row stay compact. */
  .admin-row-actions button,
  .admin-confirm-actions button {
    width: auto;
  }

  .admin-empty {
    text-align: center;
    padding: 2.5rem 1rem;
    color: var(--ink-faint);
    font-family: var(--font-readable);
  }

  /* Confirm modal */
  .admin-confirm-modal {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .admin-confirm-modal.open { display: flex; }
  .admin-confirm-backdrop {
    position: absolute; inset: 0;
    background: rgba(30,18,8,0.55);
    backdrop-filter: blur(4px);
  }
  .admin-confirm-card {
    position: relative;
    z-index: 1;
    background: var(--paper-card);
    border-radius: 16px;
    max-width: 400px;
    width: 100%;
    padding: 1.6rem;
    box-shadow: 0 24px 64px var(--shadow-deep);
  }
  .admin-confirm-card p { color: var(--ink-light); margin: 0.6rem 0 1.2rem; }
  .admin-confirm-actions { display: flex; gap: 0.6rem; }
  .admin-confirm-actions button { flex: 1; }

  .admin-stat-sub {
    font-family: var(--font-readable);
    font-size: 0.7rem;
    color: var(--ink-faint);
    margin-top: 0.1rem;
  }

  .admin-badge.replied  { background: rgba(159,143,239,0.14); color: #6a5acd; }
  .admin-badge.reacted  { background: rgba(255,111,174,0.14); color: #b5486f; }

  .msg-row { cursor: pointer; }
  .admin-row-actions { cursor: default; }

  .admin-detail {
    background: var(--paper-dark);
    border: 1.5px solid var(--line-color);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    margin-top: -0.7rem;
    padding: 1rem 1.15rem 1.1rem;
    font-family: var(--font-readable);
  }
  .admin-detail.hidden { display: none; }
  .admin-detail-block { margin-bottom: 0.8rem; }
  .admin-detail-block:last-child { margin-bottom: 0; }
  .admin-detail-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    margin-bottom: 0.3rem;
  }
  .admin-detail-text {
    font-size: 0.95rem;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--paper-card);
    border: 1px solid var(--line-color);
    border-radius: 10px;
    padding: 0.7rem 0.9rem;
  }
  .admin-detail-reaction {
    font-size: 1.3rem;
  }
  .admin-detail-meta {
    font-size: 0.78rem;
    color: var(--ink-faint);
  }
  .admin-detail-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.9rem;
  }

  /* ── Messenger-style thread inside expanded admin detail ──
     Mirrors track.html / delete.html bubble styling, sized down
     to sit compactly inside a list row instead of a full page. */
  .admin-detail .msg-thread {
    display: flex;
    flex-direction: column;
    margin: 0.2rem 0 0;
  }
  .admin-detail .msg-bubble-row {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    position: relative;
    padding-bottom: 10px;
  }
  .admin-detail .msg-bubble {
    position: relative;
    max-width: 92%;
    border-radius: 16px 16px 4px 16px;
    padding: 0.85rem 1rem 0.7rem;
    text-align: left;
    box-shadow: 0 2px 8px var(--shadow);
    word-break: break-word;
    overflow: hidden;
  }
  .admin-detail .msg-bubble.letter-bg-paper { background: #fffdf7; border: 1px solid #e8dcc8; }
  .admin-detail .msg-bubble.letter-bg-rose  { background: linear-gradient(135deg, #fff6f1, #ffe2dc); border: 1px solid #f5c5bc; }
  .admin-detail .msg-bubble.letter-bg-mint  { background: linear-gradient(135deg, #f4fff8, #d9f1df); border: 1px solid #b5dfc0; }
  .admin-detail .msg-bubble.letter-bg-sky   { background: linear-gradient(135deg, #f5fbff, #dbeeff); border: 1px solid #aacff5; }
  .admin-detail .msg-bubble-text {
    font-size: 1rem;
    line-height: 1.7;
    color: #2c1e0f;
    white-space: pre-wrap;
  }
  .admin-detail .msg-bubble-text.font-hand-caveat  { font-family: 'Caveat', cursive; font-size: 1.14rem; }
  .admin-detail .msg-bubble-text.font-hand-patrick { font-family: 'Patrick Hand', cursive; font-size: 1.05rem; }
  .admin-detail .msg-bubble-text.font-hand-kalam   { font-family: 'Kalam', cursive; font-size: 1rem; }
  .admin-detail .msg-bubble-text.font-normal       { font-family: 'Lora', Georgia, serif; font-size: 0.94rem; line-height: 1.6; }
  .admin-detail .msg-reaction-float {
    display: inline-flex;
    align-items: center;
    background: var(--paper-card);
    border: 1.5px solid #e8dcc8;
    border-radius: 999px;
    padding: 0.16rem 0.4rem;
    font-size: 1.05rem;
    box-shadow: 0 2px 6px var(--shadow);
    position: absolute;
    bottom: -2px;
    right: 14px;
  }
  .admin-detail .msg-reply-row {
    display: flex;
    align-items: flex-end;
    gap: 0.5rem;
    margin-top: 8px;
    align-self: flex-start;
    max-width: 92%;
  }
  .admin-detail .reply-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
    align-self: flex-end;
    box-shadow: 0 2px 5px var(--shadow);
    background: #2c1e0f;
    background-size: cover;
    background-position: center;
  }
  .admin-detail .reply-bubble {
    background: #f0ece4;
    border: 1px solid #e8dcc8;
    border-radius: 16px 16px 16px 4px;
    padding: 0.65rem 0.9rem;
    flex: 1;
  }
  .admin-detail .reply-bubble-name {
    font-size: 0.68rem;
    font-weight: 600;
    color: #8c7a6b;
    font-family: 'Lora', serif;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.2rem;
  }
  .admin-detail .reply-bubble-text {
    font-size: 0.92rem;
    color: #2c1e0f;
    line-height: 1.55;
    font-family: 'Kalam', cursive;
    word-break: break-word;
  }
  .admin-detail .msg-time {
    font-size: 0.65rem;
    color: #a08c7a;
    font-family: 'Lora', serif;
    margin-top: 0.4rem;
  }
  .admin-detail .msg-bubble-time { text-align: left; }
  .admin-detail .reply-time { text-align: right; }
  .admin-detail .no-reply-note {
    font-family: var(--font-readable);
    font-size: 0.82rem;
    color: var(--ink-faint);
    font-style: italic;
    margin-top: 0.4rem;
  }

  @media (max-width: 560px) {
    .admin-row { flex-direction: column; align-items: stretch; }
    .admin-row-actions { justify-content: flex-end; }
  }
</style>
</head>
<body class="dashboard-page">

<div class="bg-lines"></div>

<!-- Navbar -->
<header class="dash-nav">
  <a href="index.html" class="logo">
    <span class="logo-icon">💌</span>
    <span class="logo-text">Chithi</span>
    <span style="font-family: var(--font-readable); font-size:0.78rem; color: var(--ink-faint); margin-left:0.4rem;">Admin</span>
  </a>
  <div class="dash-nav-right">
    <button class="btn-ghost btn-sm" id="btn-logout">Sign Out</button>
  </div>
</header>

<!-- Access denied gate -->
<div id="admin-gate" class="auth-card admin-gate hidden">
  <h2 style="margin-bottom:0.6rem;">Not authorized</h2>
  <p style="margin-bottom:1.2rem;">This page is only for the site admin.</p>
  <a href="dashboard.html" class="btn-primary">Back to your inbox →</a>
</div>

<!-- Loading -->
<div id="admin-loading" class="admin-main text-center">
  <p style="margin-top:2rem; color: var(--ink-faint);">Checking access…</p>
</div>

<!-- Main admin content -->
<main class="admin-main hidden" id="admin-main">

  <div class="admin-summary-row">
    <div class="admin-stat">
      <div class="admin-stat-label">Users</div>
      <div class="admin-stat-value" id="stat-users">–</div>
    </div>
    <div class="admin-stat">
      <div class="admin-stat-label">Letters + Replies</div>
      <div class="admin-stat-value" id="stat-letters">–</div>
      <div class="admin-stat-sub" id="stat-letters-sub"></div>
    </div>
    <div class="admin-stat">
      <div class="admin-stat-label">Reported</div>
      <div class="admin-stat-value" id="stat-reported">–</div>
    </div>
    <div class="admin-stat">
      <div class="admin-stat-label">Referrals</div>
      <div class="admin-stat-value" id="stat-referrals">–</div>
    </div>
  </div>

  <div class="admin-tabs">
    <button class="admin-tab active" data-tab="users">Users</button>
    <button class="admin-tab" data-tab="letters">Letters</button>
    <button class="admin-tab" data-tab="reported">Reported</button>
    <button class="admin-tab" data-tab="referrals">Referrals</button>
  </div>

  <!-- USERS TAB -->
  <section class="admin-panel active" id="panel-users">
    <div class="admin-toolbar">
      <input type="search" id="users-search" placeholder="Search by username or email…" autocomplete="off" />
      <select id="users-sort">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="referrals">Most referrals</option>
      </select>
    </div>
    <div class="admin-list" id="users-list"></div>
  </section>

  <!-- LETTERS TAB -->
  <section class="admin-panel" id="panel-letters">
    <div class="admin-toolbar">
      <input type="search" id="letters-search" placeholder="Search letter text or recipient username…" autocomplete="off" />
      <select id="letters-filter">
        <option value="all">All letters</option>
        <option value="unread">Unread</option>
        <option value="read">Read</option>
      </select>
    </div>
    <div class="admin-list" id="letters-list"></div>
  </section>

  <!-- REPORTED TAB -->
  <section class="admin-panel" id="panel-reported">
    <div class="admin-list" id="reported-list"></div>
  </section>

  <!-- REFERRALS TAB -->
  <section class="admin-panel" id="panel-referrals">
    <div class="admin-list" id="referrals-list"></div>
  </section>

</main>

<!-- Confirm delete modal -->
<div class="admin-confirm-modal" id="confirm-modal">
  <div class="admin-confirm-backdrop" id="confirm-backdrop"></div>
  <div class="admin-confirm-card">
    <h3 id="confirm-title">Are you sure?</h3>
    <p id="confirm-body">This action can't be undone.</p>
    <div class="admin-confirm-actions">
      <button class="btn-ghost" id="confirm-cancel">Cancel</button>
      <button class="btn-danger" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<script src="clean-urls.js"></script>
<script type="module" src="firebase-config.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
