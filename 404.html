<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening Chithi...</title>
</head>
<body>
  <script>
    (function () {
      var pages = ["login", "signup", "dashboard", "user", "delete"];
      var path = window.location.pathname;
      var parts = path.split("/").filter(Boolean);
      var page = parts[parts.length - 1];

      if (pages.indexOf(page) !== -1) {
        parts[parts.length - 1] = page + ".html";
        window.location.replace("/" + parts.join("/") + window.location.search + window.location.hash);
      } else {
        window.location.replace("/" + parts.slice(0, -1).concat("index.html").join("/"));
      }
    })();
  </script>
</body>
</html>
